<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Keep up with our latest collections, exclusive deals, and special offers! Discover a new weekly collection and snag the hottest items just for you.">
    <link rel="stylesheet" href="style.css">
    <title>Newsletter</title>
</head>
<body>
    <main>
        <img src="logo.svg" alt="">
        <h1>Join our newsletter</h1>
        <p>
            Keep up with our latest collections, exclusive deals, and special
            offers! We introduce a new collection every week, so stay
            tuned to snag the hottest items just for you.
        </p>

        <form>
            <input type="email" placeholder="Enter your email address" required aria-label="Email address" id="newsletter-email" name="email">
            <button type="submit">Subscribe now</button>
            <p>Your email is 100% confidential and won't send you spam.</p>
        </form>
    </main>
</body>
</html>
